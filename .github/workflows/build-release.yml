name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Install Node dependencies (root)
        run: npm ci
      
      - name: Install Node dependencies (frontend)
        run: |
          cd src-ui
          npm ci
      
      - name: Download AI models
        run: npm run download-models
      
      - name: Verify models downloaded
        run: |
          Write-Output "Checking models directory..."
          if (!(Test-Path "models\speaker_recognition.onnx")) {
            Write-Error "Voiceprint model not found!"
            exit 1
          }
          if (!(Test-Path "models\sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20")) {
            Write-Error "ASR model not found!"
            exit 1
          }
          if (!(Test-Path "models\sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01")) {
            Write-Error "KWS model not found!"
            exit 1
          }
          Write-Output "✓ All models found"
          Get-ChildItem models -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Output "Total models size: $([math]::Round($_.Sum/1MB,2)) MB"
          }
      
      - name: Package Python backend with PyInstaller
        run: pyinstaller voicetype-server.spec
      
      - name: Ensure models are included (fallback)
        run: |
          # PyInstaller (onedir) 把 datas 放到 _internal 下。只在这里检查/补齐，
          # 避免复制到顶层造成 models 双份（安装包多 ~500MB）。
          if (!(Test-Path "dist\voicetype-server\_internal\models")) {
            Write-Output "Models not found in package, copying manually..."
            Copy-Item -Path "models" -Destination "dist\voicetype-server\_internal\" -Recurse -Force
            Write-Output "✓ Models copied manually to _internal"
          } else {
            Write-Output "✓ Models already included by PyInstaller (_internal/models)"
          }
      
      - name: Verify Python package
        run: |
          if (!(Test-Path "dist\voicetype-server\voicetype-server.exe")) {
            Write-Error "PyInstaller output not found!"
            exit 1
          }
          if (!(Test-Path "dist\voicetype-server\_internal\models")) {
            Write-Error "Models not included in package!"
            exit 1
          }
          Write-Output "✓ PyInstaller package created successfully"
          Get-ChildItem "dist\voicetype-server" -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Output "Package size: $([math]::Round($_.Sum/1MB,2)) MB"
          }
          Get-ChildItem "dist\voicetype-server\_internal\models" -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Output "Models size: $([math]::Round($_.Sum/1MB,2)) MB"
          }
      
      - name: Build Tauri application
        run: npm run build
      
      - name: Verify build output
        run: |
          if (!(Test-Path "src-tauri/target/release/bundle/nsis/*.exe")) {
            Write-Error "NSIS installer not found!"
            exit 1
          }
          Get-Item "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}}
      
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          body: |
            ## VoiceType ${{ github.ref_name }}

            ### 新增 / 改进
            - **地道回复（F7）**：选中对方消息按 F7，弹回复助手，用中文写你想回什么，AI 结合上下文生成地道英文回复（远程办公 IM 场景）
            - **文本编辑（F8）**：选中文字弹预设动作菜单（翻译 / 润色 / 精简 / 正式 / 要点）就地改写替换；预设可在「设置 → 文本动作」自由增删改
            - **全局深色模式**：主界面跟随系统深/浅色
            - **悬浮窗**：默认居中靠下；托盘右键可隐藏/显示
            - 界面全面统一（按钮系统、去除渐变、声纹页修复），删除操作统一二次确认

            ### 平台说明
            - ⚠️ **F8 文本编辑（就地替换）目前为 Windows 完整支持**；**macOS 上为实验性**：因焦点/选区机制不同，替换可能变为插入（后续版本将用原生实现修复）。其余功能（听写、F7 地道回复、场景、术语规则、声纹、统计、历史）macOS 正常可用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-macos:
    runs-on: macos-14  # 只构建 Apple Silicon (aarch64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Install Node dependencies (root)
        run: npm ci
      
      - name: Install Node dependencies (frontend)
        run: |
          cd src-ui
          npm ci
      
      - name: Download AI models
        run: npm run download-models
      
      - name: Verify models downloaded
        run: |
          echo "Checking models directory..."
          if [ ! -f "models/speaker_recognition.onnx" ]; then
            echo "Voiceprint model not found!"; exit 1
          fi
          if [ ! -d "models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20" ]; then
            echo "ASR model not found!"; exit 1
          fi
          if [ ! -d "models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01" ]; then
            echo "KWS model not found!"; exit 1
          fi
          echo "✓ All 3 models found"
          du -sh models/
      
      - name: Package Python backend with PyInstaller
        run: pyinstaller voicetype-server.spec
      
      - name: Ensure models are included (fallback)
        run: |
          # 只在 _internal 下检查/补齐，避免 models 双份（安装包多 ~500MB）
          if [ ! -d "dist/voicetype-server/_internal/models" ]; then
            echo "Models not found in package, copying manually..."
            cp -r models dist/voicetype-server/_internal/
            echo "✓ Models copied manually to _internal"
          else
            echo "✓ Models already included by PyInstaller (_internal/models)"
          fi
      
      - name: Verify Python package
        run: |
          if [ ! -f "dist/voicetype-server/voicetype-server" ]; then
            echo "PyInstaller output not found!"
            exit 1
          fi
          if [ ! -d "dist/voicetype-server/_internal/models" ]; then
            echo "Models not included in package!"
            exit 1
          fi
          echo "✓ PyInstaller package created successfully"
          du -sh dist/voicetype-server/
          du -sh dist/voicetype-server/_internal/models/
      
      - name: Build Tauri application
        run: npm run build
      
      - name: Verify build output
        run: |
          if ! ls src-tauri/target/release/bundle/dmg/*.dmg 1> /dev/null 2>&1; then
            echo "DMG installer not found!"
            exit 1
          fi
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType-macOS-AppleSilicon
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
