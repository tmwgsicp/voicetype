[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetype"
version = "0.2.0"
description = "Real-time voice-to-text input tool with AI-powered text cleanup"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "VoiceType Contributors"},
]
keywords = ["voice", "typing", "asr", "speech-to-text", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# 与 requirements.txt 保持一致的版本约束（否则从 pyproject 构建会再次踩到 httpx 那类坑）
dependencies = [
    "fastapi>=0.104.0,<0.140",
    "uvicorn>=0.24.0,<0.35",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0,<1.55",
    "httpx>=0.27,<0.28",
    "sounddevice>=0.4.6,<0.6",
    "numpy>=1.24.0,<2",
    "sherpa-onnx>=1.10,<2",
    "pypinyin>=0.55.0",
    "websockets>=13.0,<15.0",
    "pynput>=1.7.6,<1.8",
    "pydantic>=2.0.0,<3",
    "psutil>=5.9.0,<8",
]

[project.optional-dependencies]
standalone = ["pystray>=0.19.0", "Pillow>=10.0.0"]
win = ["pywin32>=306"]
mac = ["pyobjc-framework-Cocoa>=10.0"]

[project.scripts]
voicetype = "voicetype.main:run"
download-sherpa-models = "scripts.download_sherpa_models:download_models"

[project.urls]
Homepage = "https://github.com/tmwgsicp/voicetype"
Repository = "https://github.com/tmwgsicp/voicetype"

[tool.setuptools.packages.find]
include = ["voicetype*"]
